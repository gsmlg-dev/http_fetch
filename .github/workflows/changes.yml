name: Changed umbrella apps

on:
  workflow_call:
    inputs:
      workflow_file:
        required: true
        type: string
    outputs:
      apps:
        description: JSON array of app owners and affected H2 consumers
        value: ${{ jobs.detect.outputs.apps }}
      has_changes:
        description: Whether the array is nonempty
        value: ${{ jobs.detect.outputs.has_changes }}
      h2_compat:
        description: Whether shared H2 compatibility must run
        value: ${{ jobs.detect.outputs.h2_compat }}
      full_gate:
        description: Whether manual verification requires all candidate consumers
        value: ${{ jobs.detect.outputs.full_gate }}
      historical_tls:
        description: Whether manual verification requires historical compatibility coverage
        value: ${{ jobs.detect.outputs.historical_tls }}

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.paths.outputs.apps }}
      has_changes: ${{ steps.paths.outputs.has_changes }}
      h2_compat: ${{ steps.paths.outputs.h2_compat }}
      full_gate: ${{ steps.paths.outputs.full_gate }}
      historical_tls: ${{ steps.paths.outputs.historical_tls }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: paths
        env:
          WORKFLOW_FILE: ${{ inputs.workflow_file }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.after || github.sha }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base="$PR_BASE"
          else
            base="$PUSH_BASE"
          fi
          python3 scripts/ci/changed_apps.py \
            --workflow "$WORKFLOW_FILE" \
            --event "$EVENT_NAME" \
            --base "$base" \
            --head "$HEAD_SHA"
