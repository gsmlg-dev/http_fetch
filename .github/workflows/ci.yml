name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ELIXIR_VERSION: "1.18"
  OTP_VERSION: "28"

jobs:
  version:
    name: Version Metadata
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate shared version metadata
        run: |
          set -euo pipefail

          VERSION=$(sed -n 's/.*@version "\([^"]*\)".*/\1/p' mix.exs)
          if [ -z "${VERSION}" ]; then
            echo "::error::Root mix.exs is missing @version"
            exit 1
          fi

          for mix_file in mix.exs apps/*/mix.exs; do
            app_version=$(sed -n 's/.*@version "\([^"]*\)".*/\1/p' "${mix_file}")
            if [ "${app_version}" != "${VERSION}" ]; then
              echo "::error::${mix_file} version ${app_version} does not match root version ${VERSION}"
              exit 1
            fi
          done

          for app in http_runtime http_fetch http_web_socket http_event_source http_web_transport; do
            expected='{:http_core, "~> '"${VERSION}"'", in_umbrella: true, hex: :http_core}'
            if ! grep -Fq "${expected}" "apps/${app}/mix.exs"; then
              echo "::error::apps/${app}/mix.exs does not depend on http_core ${VERSION} with umbrella + Hex metadata"
              exit 1
            fi
          done

          for app in http_fetch http_web_socket http_event_source; do
            expected='{:http_runtime, "~> '"${VERSION}"'", in_umbrella: true, hex: :http_runtime}'
            if ! grep -Fq "${expected}" "apps/${app}/mix.exs"; then
              echo "::error::apps/${app}/mix.exs does not depend on http_runtime ${VERSION} with umbrella + Hex metadata"
              exit 1
            fi
          done

  compile:
    name: Compile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Compile test environment with warnings as errors
        env:
          MIX_ENV: test
        run: |
          mix deps.get
          mix compile --warnings-as-errors

  format:
    name: Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Check code formatting
        run: mix format --check-formatted

  credo:
    name: Credo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Run Credo
        run: mix credo

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Restore Dialyzer PLT cache
        uses: actions/cache@v4
        with:
          path: apps/http_fetch/priv/plts
          key: ${{ runner.os }}-dialyzer-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-dialyzer-

      - name: Run Dialyzer
        run: mix dialyzer --format github

  package:
    name: Package ${{ matrix.app }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app:
          - http_core
          - http_runtime
          - http_fetch
          - http_web_socket
          - http_event_source
          - http_web_transport

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Build package
        working-directory: apps/${{ matrix.app }}
        run: mix hex.build --unpack -o /tmp/${{ matrix.app }}_pkg

  external-consumer:
    name: External consumer smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Install dependencies
        env:
          MIX_ENV: prod
        run: mix deps.get

      - name: Run external consumer smoke test
        run: bash scripts/external_consumer_smoke.sh

  published-ex-ssl-feature-gate:
    name: Published ex_ssl feature gate (Elixir 1.18 / OTP 28)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          elixir-version: "1.18"
          otp-version: "28"

      - name: Provision independent TLS peers
        run: sudo apt-get update && sudo apt-get install --yes python3 openssl

      - name: Prepare root test dependencies
        env:
          MIX_ENV: test
        run: |
          mix deps.get --check-locked
          mix compile --warnings-as-errors

      - name: Run full published feature consumer gate
        env:
          EX_SSL_RESULTS_DIR: ${{ runner.temp }}/ex-ssl-feature-results
        run: bash scripts/ex_ssl_published_feature_gate.sh

      - name: Preserve HTTP/2 TLS lifecycle regressions
        env:
          MIX_ENV: test
        run: mix test apps/http_fetch/test/http/socket_client_http2_test.exs --seed 36

      - name: Upload sanitized feature-gate report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: published-ex-ssl-feature-gate-report
          path: ${{ runner.temp }}/ex-ssl-feature-results/*.txt
          if-no-files-found: error
