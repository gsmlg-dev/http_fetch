name: E2E

on:
  push:
    branches: [main]
    paths: ['apps/**', 'mix.exs', 'mix.lock', 'config/**', '.formatter.exs', '.credo.exs', '.dialyzer_ignore.exs', 'scripts/ci/**', 'scripts/http2_*', 'scripts/http_runtime_*', 'scripts/requirements-http2*', 'scripts/release/**', 'scripts/ex_ssl_*', '.github/workflows/**']
  pull_request:
    branches: [main]
    paths: ['apps/**', 'mix.exs', 'mix.lock', 'config/**', '.formatter.exs', '.credo.exs', '.dialyzer_ignore.exs', 'scripts/ci/**', 'scripts/http2_*', 'scripts/http_runtime_*', 'scripts/requirements-http2*', 'scripts/release/**', 'scripts/ex_ssl_*', '.github/workflows/**']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/changes.yml
    with:
      workflow_file: e2e.yml

  e2e:
    name: E2E (${{ matrix.app }})
    needs: changes
    if: needs.changes.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
      HTTP_FETCH_CI_APP: ${{ matrix.app }}
    steps:
      - name: Checkout selected source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate selected module
        run: test -d "apps/${HTTP_FETCH_CI_APP}"

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18'
          otp-version: '28'

      - name: Setup uv
        if: matrix.app == 'ex_ssl' || matrix.app == 'elixir_quic'
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: e2e-${{ matrix.app }}-${{ runner.os }}-otp28-elixir1.18-${{ hashFiles('mix.lock', 'mix.exs', format('apps/{0}/mix.exs', matrix.app)) }}

      - name: Install dependencies and compile selected closure
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix compile --warnings-as-errors

      - name: Compare TLS QUIC boundary with aioquic
        if: matrix.app == 'ex_ssl'
        run: |
          uv venv --clear _build/ex_ssl-quic-py --python 3.12
          uv pip install --python _build/ex_ssl-quic-py/bin/python -r apps/ex_ssl/e2e/quic_tls/requirements.txt
          QUIC_TLS_PYTHON="$PWD/_build/ex_ssl-quic-py/bin/python" mix run apps/ex_ssl/e2e/quic_tls/run.exs

      - name: Build pinned Caddy fingerprint fixture
        if: matrix.app == 'ex_ssl'
        run: docker build --tag ex-ssl-e2e:local apps/ex_ssl/e2e

      - name: Start Caddy fingerprint fixture
        if: matrix.app == 'ex_ssl'
        run: |
          docker run -d --name ex-ssl-e2e --publish 127.0.0.1:8443:8443 ex-ssl-e2e:local
          ready=false
          for _ in {1..30}; do
            if nc -z 127.0.0.1 8443; then ready=true; break; fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then docker logs ex-ssl-e2e; exit 1; fi

      - name: Verify Caddy JA3 and JA4 observations
        if: matrix.app == 'ex_ssl'
        working-directory: apps/ex_ssl/e2e
        env:
          MIX_BUILD_PATH: ${{ github.workspace }}/_build/ex_ssl-e2e-harness
        run: |
          mix deps.get
          mix compile --warnings-as-errors
          mix test

      - name: Stop Caddy fingerprint fixture
        if: always() && matrix.app == 'ex_ssl'
        run: |
          docker logs ex-ssl-e2e || true
          docker rm -f ex-ssl-e2e || true

      - name: Verify QUIC client, server and stream interop
        if: matrix.app == 'elixir_quic'
        run: |
          mkdir -p _build/interop
          mix run scripts/interop/run.exs client _build/interop/client
          mix run scripts/interop/run.exs server _build/interop/server
          mix run scripts/interop/stream_interop.exs
          uv run --python 3.12 --with aioquic==1.2.0 python scripts/interop/test_peer.py

      - name: Verify reliable streams under impairment
        if: matrix.app == 'elixir_quic'
        env:
          PHASE1_INTEROP_RUN: '1'
          PHASE1_SCENARIO: impaired
        run: |
          mix run scripts/phase1/interop.exs client
          mix run scripts/phase1/interop.exs server
          PHASE1_EXTERNAL=1 mix run scripts/phase1/interop.exs server

      - name: Verify QUIC DATAGRAM with aioquic
        if: matrix.app == 'elixir_quic'
        run: |
          mix run scripts/datagram/interop.exs client
          mix run scripts/datagram/interop.exs server

      - name: Verify HTTP/3 adapter over local UDP
        if: matrix.app == 'elixir_quic_http3'
        run: mix run apps/elixir_quic_http3/e2e/transport_smoke.exs

      - name: Set up Go
        if: matrix.app == 'http_fetch'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build HTTP fetch E2E server
        if: matrix.app == 'http_fetch'
        working-directory: apps/http_fetch/priv/test_server
        run: go build -o ../test_server/server .

      - name: Start HTTP fetch E2E server
        if: matrix.app == 'http_fetch'
        id: server
        run: |
          set -euo pipefail
          ./apps/http_fetch/priv/test_server/server > .e2e_port &
          echo "SERVER_PID=$!" >> "$GITHUB_OUTPUT"
          for i in {1..50}; do
            if [ -s .e2e_port ]; then
              PORT=$(grep -oE '[0-9]+' .e2e_port | head -n1)
              if curl -fs "http://127.0.0.1:${PORT}/" >/dev/null 2>&1; then
                echo "E2E_BASE_URL=http://127.0.0.1:${PORT}" >> "$GITHUB_ENV"
                exit 0
              fi
            fi
            sleep 0.2
          done
          kill "$!" 2>/dev/null || true
          exit 1

      - name: Run destination app E2E suite
        if: matrix.app == 'http_fetch' || matrix.app == 'http_web_socket' || matrix.app == 'http_event_source' || matrix.app == 'http_web_transport' || matrix.app == 'http_core' || matrix.app == 'http_runtime'
        env:
          E2E_BASE_URL: ${{ env.E2E_BASE_URL }}
        run: |
          if compgen -G "apps/${HTTP_FETCH_CI_APP}/e2e/*_test.exs" > /dev/null; then
            mix test "apps/${HTTP_FETCH_CI_APP}/e2e"
          else
            echo "No E2E ExUnit suite for ${HTTP_FETCH_CI_APP}"
          fi

      - name: Stop HTTP fetch E2E server
        if: always() && matrix.app == 'http_fetch'
        run: |
          if [ -n "${{ steps.server.outputs.SERVER_PID }}" ]; then
            kill "${{ steps.server.outputs.SERVER_PID }}" 2>/dev/null || true
          fi
          rm -f .e2e_port
