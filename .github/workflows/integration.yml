name: Integration

on:
  push:
    branches: [main, develop]
    paths: ['apps/**', 'packages/abyss_raw/**', 'mix.exs', 'mix.lock', 'config/**', '.formatter.exs', '.credo.exs', '.dialyzer_ignore.exs', 'scripts/ci/**', 'scripts/http2_*', 'scripts/http_runtime_*', 'scripts/requirements-http2*', 'scripts/release/**', 'scripts/migration/**', 'scripts/ex_ssl_*', '.github/workflows/**']
  pull_request:
    branches: [main]
    paths: ['apps/**', 'packages/abyss_raw/**', 'mix.exs', 'mix.lock', 'config/**', '.formatter.exs', '.credo.exs', '.dialyzer_ignore.exs', 'scripts/ci/**', 'scripts/http2_*', 'scripts/http_runtime_*', 'scripts/requirements-http2*', 'scripts/release/**', 'scripts/migration/**', 'scripts/ex_ssl_*', '.github/workflows/**']

  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ELIXIR_VERSION: "1.18"
  OTP_VERSION: "28"

jobs:
  changes:
    uses: ./.github/workflows/changes.yml
    with:
      workflow_file: integration.yml

  test:
    name: Integration ${{ matrix.app }}
    needs: changes
    if: needs.changes.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    env:
      MIX_ENV: test
      HTTP_QUIC_PHASE1_REAL: "1"
      HTTP_FETCH_CI_APP: ${{ matrix.app }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: integration-${{ matrix.app }}-${{ runner.os }}-otp28-elixir1.18-${{ hashFiles('mix.lock', 'mix.exs', format('apps/{0}/mix.exs', matrix.app)) }}

      - uses: actions/setup-python@v5
        if: matrix.app == 'ex_ssl' || matrix.app == 'http_runtime' || matrix.app == 'http_fetch' || matrix.app == 'http_event_source' || matrix.app == 'http_web_socket'
        with:
          python-version: '3.12'

      - name: Set up pinned independent HTTP/3 peer runner
        if: matrix.app == 'http_fetch'
        uses: astral-sh/setup-uv@v5

      - name: Install independent admission peer dependencies
        if: matrix.app == 'ex_ssl' || matrix.app == 'http_runtime' || matrix.app == 'http_fetch' || matrix.app == 'http_event_source' || matrix.app == 'http_web_socket'
        run: python3 -m pip install --requirement scripts/requirements-http2-stream-clients.txt

      - name: Install dependencies
        env:
          MIX_ENV: test
        run: mix deps.get

      - name: Compile selected closure
        env:
          MIX_ENV: test
        run: mix compile --warnings-as-errors

      - name: Run integration tests
        env:
          MIX_ENV: test
        run: mix test apps/${{ matrix.app }}/test --only integration

  migration:
    name: QUIC migration (${{ matrix.mode }})
    needs: changes
    if: needs.changes.outputs.has_changes == 'true' && (contains(fromJSON(needs.changes.outputs.apps), 'elixir_quic') || contains(fromJSON(needs.changes.outputs.apps), 'abyss'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [standalone, abyss]
    env:
      MIX_ENV: test
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - name: Set up pinned independent migration peer runner
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.6.17'
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: migration-${{ matrix.mode }}-${{ runner.os }}-otp28-elixir1.18-${{ hashFiles('mix.lock', 'mix.exs', 'apps/*/mix.exs') }}
      - name: Check migration harness controls
        run: python3 -m unittest discover -s scripts/migration -p 'test_*.py' -v
      - name: Prepare source migration listeners
        run: |
          mix deps.get --check-locked
          mix format --check-formatted scripts/migration/gate.exs
          mix compile --warnings-as-errors
      - name: Require independent migration traffic and cleanup receipts
        shell: bash
        run: python3 scripts/migration/gate.py --mode "${{ matrix.mode }}" --timeout 30 | tee "$RUNNER_TEMP/migration-${{ matrix.mode }}.jsonl"
      - name: Preserve migration receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-${{ matrix.mode }}-${{ github.sha }}
          path: ${{ runner.temp }}/migration-${{ matrix.mode }}.jsonl
          if-no-files-found: error
