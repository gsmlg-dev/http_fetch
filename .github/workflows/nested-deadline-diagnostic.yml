name: Bounded WebSocket opening diagnostic

on:
  push:
    branches: [diagnostic/nested-deadline-20261102]
    paths: [.github/workflows/nested-deadline-diagnostic.yml]

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        fixture: [original, primed]
        scope: [socket, full]
    env:
      MIX_ENV: test
      HTTP_FETCH_CI_APP: http_web_socket
      HTTP_QUIC_PHASE1_REAL: '1'
      DIAGNOSTIC_FIXTURE: ${{ matrix.fixture }}
      DIAGNOSTIC_SCOPE: ${{ matrix.scope }}
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18'
          otp-version: '28'
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: integration-http_web_socket-${{ runner.os }}-otp28-elixir1.18-${{ hashFiles('mix.lock', 'mix.exs', 'apps/http_web_socket/mix.exs') }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
      - name: Prepare original integration environment
        run: |
          python3 -m pip install --requirement scripts/requirements-http2-stream-clients.txt
          mix deps.get --check-locked
          mix compile --warnings-as-errors
      - name: Instrument only public fixture timing and optional untimed priming
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path('apps/http_web_socket/test/http/web_socket_test.exs')
          source = path.read_text()
          marker = '      socket =\n        WebSocket.new("wss://127.0.0.1:#{port}/socket", [],\n'
          assert source.count(marker) == 1
          source = source.replace(marker, '''      started = System.monotonic_time(:millisecond)
                IO.inspect(%{backend: backend, at_ms: started}, label: "websocket_request_start")
          ''' + marker)
          marker = '      assert_receive {WebSocket, ^socket, %Open{}}, 1_000\n'
          assert source.count(marker) == 1
          source = source.replace(marker, '''      try do
                  assert_receive {WebSocket, ^socket, %Open{}}, 1_000
                  IO.inspect(%{backend: backend, elapsed_ms: System.monotonic_time(:millisecond) - started}, label: "websocket_open")
                rescue
                  error in ExUnit.AssertionError ->
                    late = receive do
                      {WebSocket, ^socket, %Open{}} -> :open
                    after
                      2_000 -> :still_pending
                    end
                    IO.inspect(%{backend: backend, late: late, elapsed_ms: System.monotonic_time(:millisecond) - started}, label: "websocket_open_after_failed_assertion")
                    reraise error, __STACKTRACE__
                end
          ''')
          if os.environ['DIAGNOSTIC_FIXTURE'] == 'primed':
              marker = '  test "upgrades, exchanges frames, and closes over verified TLS 1.3" do\n'
              assert source.count(marker) == 1
              source = source.replace(marker, marker + '''
              {:ok, _warm_server, warm_port} = HTTPWebSocket.TestServer.start_link(tls: true, certfile: @certfile, keyfile: @keyfile)
              warm = WebSocket.new("wss://127.0.0.1:#{warm_port}/warm", [], ssl: [cacertfile: @cacertfile])
              assert_receive {WebSocket, ^warm, %Open{}}, 4_000
              assert :ok = WebSocket.close(warm, 1000, "warm")
              assert_receive {WebSocket, ^warm, %Close{code: 1000, was_clean: true}}, 1_000
              assert :ok = HTTP.ClientCompletion.await(WebSocket.completion(warm), 1_000)
          ''')
          path.write_text(source)

          path = Path('apps/http_web_socket/test/support/web_socket_server.ex')
          source = path.read_text()
          marker = '        with {:ok, socket} <- accept(tls?, listen_socket),\n'
          assert source.count(marker) == 1
          source = source.replace(marker, '        started = System.monotonic_time(:millisecond)\n' + marker)
          marker = '          serve(socket, parent, opts, transport)\n'
          assert source.count(marker) == 1
          source = source.replace(marker, '''          IO.inspect(%{tls: tls?, elapsed_ms: System.monotonic_time(:millisecond) - started, at_ms: System.monotonic_time(:millisecond)}, label: "websocket_reference_accept")
          ''' + marker)
          marker = '      send(parent, {:websocket_server_handshake, request})\n'
          assert source.count(marker) == 1
          source = source.replace(marker, '      IO.inspect(%{tls: transport == :ssl, at_ms: System.monotonic_time(:millisecond)}, label: "websocket_upgrade_sent")\n' + marker)
          path.write_text(source)
          PY
      - name: Run all original assertions at the failing seed
        run: |
          if [ "$DIAGNOSTIC_SCOPE" = socket ]; then
            mix test apps/http_web_socket/test/http/web_socket_test.exs --only integration --seed 730652 --trace
          else
            mix test apps/http_web_socket/test --only integration --seed 730652
          fi
