name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Shared fourteen-package version (major.minor.patch or major.minor.patch-rc.N)
        required: true
        type: string
      git_ref:
        description: Branch to release from
        required: true
        default: main
        type: string
      publish_docs:
        description: Publish documentation after each publication group is verified
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Publish thirteen portable packages
    concurrency:
      group: release-portable-http-fetch-packages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_BRANCH: ${{ inputs.git_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0

      - name: Validate immutable tag and branch
        id: revision
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.(0|[1-9][0-9]*))?$ ]]
          git check-ref-format --branch "$RELEASE_BRANCH"
          test "$(git branch --show-current)" = "$RELEASE_BRANCH"
          if git rev-parse --verify --quiet "refs/tags/v$RELEASE_VERSION"; then
            git merge-base --is-ancestor "refs/tags/v$RELEASE_VERSION" HEAD
            if ! git grep -Fq 'RELEASE_PACKAGES = (*PACKAGES, "http_test", "abyss", "hell")' "refs/tags/v$RELEASE_VERSION" -- scripts/release/stage.py; then
              echo "Existing tag lacks the unified portable/native release contract; it cannot be reused." >&2
              exit 1
            fi
            git checkout --detach "refs/tags/v$RELEASE_VERSION"
            echo "existing=true" >> "$GITHUB_OUTPUT"
          else
            echo "existing=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18'
          otp-version: '28'

      - name: Prepare or validate versions and exact internal graph
        run: |
          if [ "${{ steps.revision.outputs.existing }}" = true ]; then
            elixir scripts/release/versions.exs validate "$RELEASE_VERSION"
          else
            elixir scripts/release/versions.exs prepare "$RELEASE_VERSION"
          fi

      - name: Check release changelog section
        run: |
          grep -Fq "## [$RELEASE_VERSION]" CHANGELOG.md || {
            echo "CHANGELOG.md is missing section $RELEASE_VERSION" >&2
            exit 1
          }

      - name: Install dependencies
        run: mix deps.get

      - name: Compile applications
        run: mix compile

      - name: Build thirteen portable archives
        run: python3 scripts/release/stage.py build "$RELEASE_VERSION" "$RUNNER_TEMP/stage" "$RUNNER_TEMP/archives"

      - name: Preflight Hex and GitHub immutability before any remote write
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release/hex_packages.py preflight "$RELEASE_VERSION" "$RUNNER_TEMP/archives"
          python3 scripts/release/github_assets.py preflight "$RELEASE_VERSION" "$RUNNER_TEMP/archives"

      - name: Check Hex publication credentials
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          test -n "$HEX_API_KEY" || { echo "HEX_API_KEY is required to publish all thirteen portable packages" >&2; exit 1; }

      - name: Commit version and create immutable tag
        if: steps.revision.outputs.existing == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mix.exs apps/*/mix.exs packages/abyss_raw/mix.exs
          if ! git diff --cached --quiet; then git commit -m "chore(release): v$RELEASE_VERSION"; fi
          git tag "v$RELEASE_VERSION"
          git push --atomic origin "HEAD:refs/heads/$RELEASE_BRANCH" "refs/tags/v$RELEASE_VERSION"

      - name: Record immutable release source
        id: identity
        run: echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish and verify packages in dependency order
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: python3 scripts/release/hex_packages.py publish "$RELEASE_VERSION" "$RUNNER_TEMP/archives" "$RUNNER_TEMP/stage"

      - name: Attach and verify all immutable GitHub release archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/github_assets.py complete "$RELEASE_VERSION" "$RUNNER_TEMP/archives"

      - name: Preserve verified portable archives for asynchronous native publication
        uses: actions/upload-artifact@v4
        with:
          name: portable-release-${{ inputs.version }}
          path: ${{ runner.temp }}/archives/*.tar
          if-no-files-found: error
          overwrite: true

      - name: Publish package documentation separately
        if: inputs.publish_docs
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: python3 scripts/release/docs.py "$RELEASE_VERSION" "$RUNNER_TEMP/stage" --publish

  native-release:
    name: Publish optional abyss_raw after the portable release
    concurrency:
      group: release-abyss-raw-${{ inputs.version }}
      cancel-in-progress: false
    needs: release
    runs-on: ubuntu-24.04
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.source_sha }}
          fetch-depth: 0
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18'
          otp-version: '28'
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify shared immutable tag and native version
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/v$RELEASE_VERSION^{commit}")"
          elixir scripts/release/versions.exs validate "$RELEASE_VERSION"
      - name: Download verified portable publication artifacts
        uses: actions/download-artifact@v4
        with:
          name: portable-release-${{ inputs.version }}
          path: ${{ runner.temp }}/archives
      - name: Install native dependencies
        working-directory: packages/abyss_raw
        run: mix deps.get
      - name: Compile native package
        working-directory: packages/abyss_raw
        run: mix compile
      - name: Build and audit the native archive from the shared tag
        run: python3 scripts/release/server_packages.py build native --version "$RELEASE_VERSION" --stage "$RUNNER_TEMP/stage" --archives "$RUNNER_TEMP/archives"
      - name: Preflight immutable native Hex and GitHub artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release/hex_packages.py preflight "$RELEASE_VERSION" "$RUNNER_TEMP/archives" --group native
          python3 scripts/release/github_assets.py preflight "$RELEASE_VERSION" "$RUNNER_TEMP/archives" --group native
      - name: Publish native package after verified Abyss publication
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
          MIX_ENV: prod
        run: python3 scripts/release/server_packages.py publish native --version "$RELEASE_VERSION" --stage "$RUNNER_TEMP/stage" --archives "$RUNNER_TEMP/archives"
      - name: Attach and verify immutable native GitHub archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/github_assets.py complete "$RELEASE_VERSION" "$RUNNER_TEMP/archives" --group native
      - name: Publish verified native documentation
        if: inputs.publish_docs
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: python3 scripts/release/server_packages.py publish-docs native --version "$RELEASE_VERSION" --stage "$RUNNER_TEMP/stage" --archives "$RUNNER_TEMP/archives"
      - name: Report asynchronous native publication result
        if: always()
        env:
          NATIVE_JOB_STATUS: ${{ job.status }}
        run: |
          printf 'abyss_raw %s: %s (independent of the completed thirteen-package release)\n' "$RELEASE_VERSION" "$NATIVE_JOB_STATUS" >> "$GITHUB_STEP_SUMMARY"
