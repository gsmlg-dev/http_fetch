name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Shared nine-package version (stable major.minor.patch)
        required: true
        type: string
      git_ref:
        description: Branch to release from
        required: true
        default: main
        type: string
      publish_docs:
        description: Publish package documentation after all packages are verified
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-all-http-fetch-packages
  cancel-in-progress: false

jobs:
  release:
    name: Validate and release all nine packages
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_BRANCH: ${{ inputs.git_ref }}
      RELEASE_APPS: ex_ssl elixir_quic http_core elixir_quic_http3 http_runtime http_fetch http_web_socket http_event_source http_web_transport
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0

      - name: Validate immutable tag and branch
        id: revision
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git check-ref-format --branch "$RELEASE_BRANCH"
          test "$(git branch --show-current)" = "$RELEASE_BRANCH"
          if git rev-parse --verify --quiet "refs/tags/v$RELEASE_VERSION"; then
            git merge-base --is-ancestor "refs/tags/v$RELEASE_VERSION" HEAD
            if ! git cat-file -e "refs/tags/v$RELEASE_VERSION:scripts/release/consumer_gate.py" 2>/dev/null; then
              echo "Existing tag lacks the nine-package release contract; it cannot be reused." >&2
              exit 1
            fi
            git checkout --detach "refs/tags/v$RELEASE_VERSION"
            echo "existing=true" >> "$GITHUB_OUTPUT"
          else
            echo "existing=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18'
          otp-version: '28'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Prepare or validate versions and exact internal graph
        run: |
          if [ "${{ steps.revision.outputs.existing }}" = true ]; then
            elixir scripts/release/versions.exs validate "$RELEASE_VERSION"
          else
            elixir scripts/release/versions.exs prepare "$RELEASE_VERSION"
          fi

      - name: Check release changelog section
        run: |
          grep -Fq "## [$RELEASE_VERSION]" CHANGELOG.md || {
            echo "CHANGELOG.md is missing section $RELEASE_VERSION" >&2
            exit 1
          }

      - name: Install locked dependencies
        run: |
          mix deps.get --check-locked
          MIX_ENV=test mix deps.get --check-locked

      - name: Compile all applications in default environment
        run: mix compile --warnings-as-errors

      - name: Prepare independent admission peer before source tests
        run: uv pip install --python "$(command -v python3)" --requirement scripts/requirements-http2-stream-clients.txt

      - name: Validate all source and automation
        env:
          MIX_ENV: test
        run: |
          unset HTTP_FETCH_CI_APP
          mix format --check-formatted
          mix format --check-formatted scripts/phase1/interop.exs scripts/phase1/release_check.exs scripts/datagram/interop.exs
          mix format --check-formatted scripts/phase1/admission.exs scripts/phase1/admission_test.exs
          mix format --check-formatted scripts/release/versions.exs scripts/release/archives.exs scripts/release/http3_consumer.exs
          mix format --check-formatted scripts/http3/session_gate.exs scripts/http3/public_gate.exs scripts/http3/canary.exs
          mix compile --warnings-as-errors
          mix run scripts/phase1/admission_test.exs
          mix test --seed 28092026
          mix test apps/ex_ssl/test --include integration --seed 743209
          mix credo
          mix dialyzer --format github
          python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
          python3 -m unittest discover -s scripts/release -p 'test_*.py' -v
          git diff --check
          git diff --exit-code -- mix.lock

      - name: Build and run Go HTTP E2E server
        run: |
          set -euo pipefail
          (cd apps/http_fetch/priv/test_server && go build -o ../test_server/server .)
          ./apps/http_fetch/priv/test_server/server > .e2e_port &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; rm -f .e2e_port' EXIT
          for i in {1..50}; do
            if [ -s .e2e_port ]; then
              port=$(grep -oE '[0-9]+' .e2e_port | head -n1)
              if curl -fs "http://127.0.0.1:$port/" >/dev/null 2>&1; then
                E2E_BASE_URL="http://127.0.0.1:$port" MIX_ENV=test mix test.e2e
                exit 0
              fi
            fi
            sleep 0.2
          done
          exit 1

      - name: Run all local imported transport gates
        env:
          MIX_ENV: test
        run: |
          mix run apps/elixir_quic_http3/e2e/transport_smoke.exs
          mix run scripts/interop/run.exs client "$RUNNER_TEMP/quic-client"
          mix run scripts/interop/run.exs server "$RUNNER_TEMP/quic-server"
          mix run scripts/interop/stream_interop.exs
          mix run scripts/datagram/interop.exs client
          mix run scripts/datagram/interop.exs server

      - name: Verify QUIC reliable streams under impairment
        env:
          MIX_ENV: test
          PHASE1_INTEROP_RUN: '1'
          PHASE1_SCENARIO: impaired
        run: |
          mix run scripts/phase1/interop.exs client
          mix run scripts/phase1/interop.exs server
          PHASE1_EXTERNAL=1 mix run scripts/phase1/interop.exs server

      - name: Build pinned Caddy TLS fingerprint fixture
        run: docker build --tag ex-ssl-e2e:local apps/ex_ssl/e2e

      - name: Verify Caddy JA3 and JA4 observations
        env:
          MIX_BUILD_PATH: ${{ runner.temp }}/ex-ssl-e2e-harness
        run: |
          set -euo pipefail
          docker run -d --name ex-ssl-e2e --publish 127.0.0.1:8443:8443 ex-ssl-e2e:local
          trap 'docker logs ex-ssl-e2e || true; docker rm -f ex-ssl-e2e || true' EXIT
          for i in {1..30}; do
            if nc -z 127.0.0.1 8443; then break; fi
            sleep 1
          done
          nc -z 127.0.0.1 8443
          (cd apps/ex_ssl/e2e && mix deps.get && mix compile --warnings-as-errors && mix test)

      - name: Run pinned aioquic comparison
        run: |
          uv run --python 3.12 --with aioquic==1.2.0 python scripts/interop/test_peer.py
          uv venv --clear "$RUNNER_TEMP/ex-ssl-quic-py" --python 3.12
          uv pip install --python "$RUNNER_TEMP/ex-ssl-quic-py/bin/python" -r apps/ex_ssl/e2e/quic_tls/requirements.txt
          QUIC_TLS_PYTHON="$RUNNER_TEMP/ex-ssl-quic-py/bin/python" MIX_ENV=test mix run apps/ex_ssl/e2e/quic_tls/run.exs

      - name: Build documentation
        run: mix docs

      - name: Verify HTTP/3 companion with pinned independent aioquic
        run: uv run --python 3.12 --with aioquic==1.2.0 python scripts/http3/session_gate.py

      - name: Require independent public HTTP3 before publication
        env:
          MIX_ENV: test
          HTTP3_GATE_LOG_DIR: ${{ runner.temp }}/http3-release-logs/source
        run: |
          uv run --python 3.12 --with aioquic==1.2.0 python -m unittest discover -s scripts/http3 -p 'caddy_*_test.py' -v
          uv run --python 3.12 --with aioquic==1.2.0 python scripts/http3/public_gate.py

      - name: Build, inspect, and independently consume all nine archives
        run: |
          python3 scripts/release/stage.py build "$RELEASE_VERSION" "$RUNNER_TEMP/stage" "$RUNNER_TEMP/archives"
          elixir scripts/release/archives.exs "$RELEASE_VERSION" "$RUNNER_TEMP/archives"
          python3 scripts/release/archive_audit.py "$RELEASE_VERSION" "$RUNNER_TEMP/stage" "$RUNNER_TEMP/archives"
          python3 scripts/release/stage.py verify "$RELEASE_VERSION" "$RUNNER_TEMP/stage" "$RUNNER_TEMP/archives"
          python3 scripts/release/consumer_gate.py "$RELEASE_VERSION" "$RUNNER_TEMP/archives"
          python3 scripts/release/consumer_gate.py "$RELEASE_VERSION" "$RUNNER_TEMP/archives" --mode external

      - name: Require isolated candidate HTTP3 traffic
        env:
          HTTP3_GATE_LOG_DIR: ${{ runner.temp }}/http3-release-logs/candidate
        run: python3 scripts/release/consumer_gate.py "$RELEASE_VERSION" "$RUNNER_TEMP/archives" --mode http3

      - name: Verify real HTTP/2 package traffic and TLS feature groups
        env:
          HTTP_FETCH_ARCHIVE_DIR: ${{ runner.temp }}/archives
          HTTP_FETCH_RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
          EX_SSL_DEP_MODE: candidate
          EX_SSL_CANDIDATE_ARCHIVE_DIR: ${{ runner.temp }}/archives
        run: |
          uv pip install --python "$(command -v python3)" --requirement scripts/requirements-http2-stream-clients.txt
          python3 scripts/http_runtime_package_traffic_gate.py
          bash scripts/ex_ssl_source_smoke.sh

      - name: Preflight Hex and GitHub immutability before any remote write
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release/hex_packages.py preflight "$RELEASE_VERSION" "$RUNNER_TEMP/archives"
          python3 scripts/release/github_assets.py preflight "$RELEASE_VERSION" "$RUNNER_TEMP/archives"

      - name: Check Hex publication credentials
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          test -n "$HEX_API_KEY" || { echo "HEX_API_KEY is required to publish all nine packages" >&2; exit 1; }

      - name: Commit version and create immutable tag
        if: steps.revision.outputs.existing == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mix.exs apps/*/mix.exs
          if ! git diff --cached --quiet; then git commit -m "chore(release): v$RELEASE_VERSION"; fi
          git tag "v$RELEASE_VERSION"
          git push --atomic origin "HEAD:refs/heads/$RELEASE_BRANCH" "refs/tags/v$RELEASE_VERSION"

      - name: Publish and verify packages in dependency order
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: python3 scripts/release/hex_packages.py publish "$RELEASE_VERSION" "$RUNNER_TEMP/archives" "$RUNNER_TEMP/stage"

      - name: Verify published isolated HTTP3 traffic
        env:
          HTTP3_GATE_LOG_DIR: ${{ runner.temp }}/http3-release-logs/published
        run: python3 scripts/release/consumer_gate.py "$RELEASE_VERSION" "$RUNNER_TEMP/archives" --mode http3 --published

      - name: Attach and verify all immutable GitHub release archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/github_assets.py complete "$RELEASE_VERSION" "$RUNNER_TEMP/archives"

      - name: Publish package documentation separately
        if: inputs.publish_docs
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: python3 scripts/release/docs.py "$RELEASE_VERSION" "$RUNNER_TEMP/stage" --publish

      - name: Preserve HTTP3 release peer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: http3-release-peer-logs
          path: ${{ runner.temp }}/http3-release-logs
          if-no-files-found: warn
