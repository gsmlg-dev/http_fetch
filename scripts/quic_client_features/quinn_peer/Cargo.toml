# Independent unmodified quinn server fixture for the M2 peer-disabled
# migration negative. Versions are exact; Cargo.lock pins the full graph.
[package]
name = "quinn-m2-peer"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
quinn = { version = "=0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
quinn-proto = { version = "=0.11.17", default-features = false }
rustls = { version = "=0.23.42", default-features = false, features = ["ring", "std"] }
ring = "=0.17.14"
tokio = { version = "=1.52.3", features = ["rt", "macros", "time", "net"] }

[profile.release]
debug = false
